<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="music-container">
        <!-- Sidebar / Playlist Section -->
        <div class="playlist-section">
            <h2>Playlist</h2>
            
            <!-- Search & Categorize -->
            <div class="controls-group">
                <input type="text" id="searchInput" placeholder="Search song or artist...">
                <select id="genreFilter">
                    <option value="all">All Genres</option>
                    <option value="pop">Pop</option>
                    <option value="electronic">Electronic</option>
                    <option value="acoustic">Acoustic</option>
                </select>
            </div>

            <ul id="playlist" class="playlist-list">
                <!-- Dynamically populated via JS -->
            </ul>
        </div>

        <!-- Main Player Section -->
        <div class="player-section">
            <div class="song-info">
                <div class="thumbnail-container">
                    <img id="songImage" src="" alt="Album Art">
                </div>
                <h1 id="songTitle">Song Title</h1>
                <p id="songArtist">Artist Name</p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-container">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <!-- Main Controls -->
            <div class="player-controls">
                <button id="prevBtn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playBtn" class="play-pause-btn" title="Play/Pause"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <button id="nextBtn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
            </div>

            <!-- Volume Control -->
            <div class="volume-control">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioElement"></audio>

    <script src="script.js"></script>
</body>
</html>
